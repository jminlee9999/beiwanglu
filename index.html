<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F3F4F8">
  <meta name="description" content="拾光备忘：一款只把数据存在你手机里的私人备忘录。记录计划、日常、图片视频与好物收藏。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拾光备忘">
  <meta name="format-detection" content="telephone=no">
  <title>拾光备忘 · 私人备忘录</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-shell" id="app" aria-live="off">
    <div class="boot-screen" aria-label="正在打开拾光备忘">
      <div class="boot-mark">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="7" y="9" width="34" height="32" rx="9" fill="white" opacity=".96"/>
          <path d="M15 20h18M15 26h11" stroke="#E98975" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M31 30.5c0-2.2 3.2-4.4 4.4-4.9.3-.1.6.2.5.5-.3 1.5-1.7 4.9-4.3 5.7" fill="#F3A94E"/>
        </svg>
      </div>
      <p>正在打开你的备忘录…</p>
    </div>
  </div>

  <noscript>
    <div class="noscript">请开启 JavaScript 后使用拾光备忘。</div>
  </noscript>
</body>
</html>
